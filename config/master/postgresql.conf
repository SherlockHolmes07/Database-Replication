# Master PostgreSQL Configuration for Replication

# Listen on all interfaces (important for Docker networking)
listen_addresses = '*'

# Without this, Postgres ignores the mounted pg_hba.conf and falls back to
# the auto-generated one in the data directory, which has no replication rule
hba_file = '/etc/postgresql/pg_hba.conf'

# WAL (Write-Ahead Logging) Configuration - required for replication
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB

# Synchronous replication: COMMIT on master blocks until the standby named
# here (matched by its application_name) confirms. remote_apply = strongest
# guarantee, master waits until the replica has actually replayed the change,
# not just written it to its own WAL. If this standby is unreachable, writes
# on master block indefinitely - that's the tradeoff, not a bug.
synchronous_standby_names = 'replica1'
synchronous_commit = remote_apply

# Checkpoint configuration
checkpoint_timeout = 15min
max_wal_size = 4GB

# Logging
log_replication_commands = on
log_connections = on
log_disconnections = on
